name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python - pytest + bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

      - name: Run bandit security scan
        run: python -m bandit -r backend/ -ll

  frontend:
    name: Frontend - Node.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/dashboard-live.js
          node --check frontend/js/preflight-view.js
          node --check frontend/js/htmlpdf-view.js
          node --check frontend/js/tuto-overlay.js
          node --check frontend/js/cockpit-view.js
          node --check frontend/js/sentinel-helpers.js
          node --check frontend/js/sentinel-views.js

      - name: Run frontend tests
        run: node tests/frontend/test_activity_analysis.mjs

      - name: Install Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run render smoke test
        run: node tests/frontend/test_render_smoke.mjs

  deps:
    name: Dependencies - CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit requirements.txt for known CVEs
        run: pip-audit -r requirements.txt --disable-pip --format json -o pip-audit-report.json
        continue-on-error: true

      - name: Upload CVE audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

  lint:
    name: Lint - ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check (non-blocking watchdog)
        run: ruff check backend/ tests/ tools/ scripts/ --statistics
        continue-on-error: true

      - name: Ruff format check (non-blocking watchdog)
        run: ruff format backend/ tests/ tools/ scripts/ --check
        continue-on-error: true
